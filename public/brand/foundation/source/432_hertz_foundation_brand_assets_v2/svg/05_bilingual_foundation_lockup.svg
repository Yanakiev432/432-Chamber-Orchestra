<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180" role="img" aria-label="432 Hertz Foundation logo">
  <defs>
    <style><![CDATA[
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: Inter, Avenir, Helvetica, Arial, sans-serif; }
      .teal { fill: #123c3c; }
      .slate { fill: #334155; }
      .charcoal { fill: #1f2937; }
      .copper { fill: #a16207; }
      .mist { fill: #f8fafc; }
