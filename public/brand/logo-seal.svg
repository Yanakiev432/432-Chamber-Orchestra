  <style>
    .serif{font-family:"Cormorant Garamond","Libre Baskerville",Georgia,serif}.sans{font-family:Inter,"Avenir Next","Helvetica Neue",Arial,sans-serif}.num{font-feature-settings:"tnum" 1}
  </style>
  <circle cx="210" cy="210" r="160" fill="none" stroke="#123c3c" stroke-width="3"/>
